---
openapi: 3.0.3
info:
  title: Marketplace API
  version: 2.0.0
  description: Контракт ДЗ №2. Все суммы — RUB с точностью до копейки. Одинаковые
    product_id в заказе запрещены. details ошибок — объект. Неизвестные поля запросов
    запрещены. User Service и Commerce Service имеют отдельные БД; Gateway сохраняет
    публичные URL.
security:
- bearerAuth: []
paths:
  "/health":
    get:
      operationId: health
      description: Проверка доступности приложения и PostgreSQL.
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      security: []
  "/auth/register":
    post:
      operationId: register
      description: Регистрация USER или SELLER. ADMIN создаётся отдельно через bootstrap.
      responses:
        '201':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenPair"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      security: []
  "/auth/login":
    post:
      operationId: login
      description: 'Вход: JWT access 15 минут и JWT refresh 14 дней.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenPair"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      security: []
  "/auth/refresh":
    post:
      operationId: refresh
      description: Однократная ротация refresh JWT; повторное использование запрещено.
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenPair"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshRequest"
      security: []
  "/products":
    post:
      operationId: createProduct
      description: 'SELLER и ADMIN: создать товар. seller_id берётся из JWT;
        ADMIN может изменять и удалять любые товары.'
      responses:
        '201':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductCreate"
    get:
      operationId: listProducts
      description: 'USER, SELLER, ADMIN: все товары, включая ARCHIVED. Фильтры применяются
        точно.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductPage"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/ProductStatus"
      - name: category
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
  "/products/{id}":
    get:
      operationId: getProduct
      description: 'USER, SELLER, ADMIN: любой товар.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateProduct
      description: 'SELLER: только свой товар. ADMIN: любой. Полная замена изменяемых
        полей.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductUpdate"
    delete:
      operationId: deleteProduct
      description: 'SELLER: только свой товар. ADMIN: любой. Мягкое удаление в ARCHIVED.'
      responses:
        '204':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  "/orders":
    post:
      operationId: createOrder
      description: USER, ADMIN. Проверки лимита, активного заказа, каталога, остатков;
        резерв и скидка атомарны. Повторные product_id запрещены.
      responses:
        '201':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrderCreate"
  "/orders/{id}":
    get:
      operationId: getOrder
      description: 'USER: только свой. ADMIN: любой. SELLER запрещён.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateOrder
      description: 'USER: свой CREATED. ADMIN: любой CREATED. Возврат и резерв атомарны;
        цена снимается заново. Неприменимый промокод снимается.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrderUpdate"
  "/orders/{id}/cancel":
    post:
      operationId: cancelOrder
      description: 'USER: свой CREATED/PAYMENT_PENDING. ADMIN: любой. Однократный
        возврат остатков и использования промокода.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  "/orders/{id}/status":
    post:
      operationId: transitionOrder
      description: 'ADMIN: CREATED → PAYMENT_PENDING → PAID → SHIPPED → COMPLETED.
        Отмена — отдельный метод.'
      responses:
        '200':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OrderTransition"
  "/promo-codes":
    post:
      operationId: createPromo
      description: 'SELLER, ADMIN: создание промокода. valid_until > valid_from. Процент
        выше 70 не даёт скидки.'
      responses:
        '201':
          description: Успешная операция
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Идентификатор запроса
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PromoResponse"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '403':
          "$ref": "#/components/responses/Error403"
        '404':
          "$ref": "#/components/responses/Error404"
        '405':
          "$ref": "#/components/responses/Error405"
        '409':
          "$ref": "#/components/responses/Error409"
        '422':
          "$ref": "#/components/responses/Error422"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
        '503':
          "$ref": "#/components/responses/Error503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PromoCreate"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access JWT EdDSA, подписанный только User Service; Commerce проверяет
        открытый ключ. Claims: sub, role, type, exp, iat, iss=user-service, aud.'
  schemas:
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    Role:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    ProductCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        stock:
          type: integer
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          "$ref": "#/components/schemas/ProductStatus"
      required:
      - name
      - price
      - stock
      - category
      - status
      description: Создание товара. Владелец определяется по sub JWT, не из тела запроса.
    ProductUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        stock:
          type: integer
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          "$ref": "#/components/schemas/ProductStatus"
      required:
      - name
      - price
      - stock
      - category
      - status
    ProductResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 4000
        price:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        stock:
          type: integer
          minimum: 0
          maximum: 2147483647
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          "$ref": "#/components/schemas/ProductStatus"
        seller_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
    ProductPage:
      type: object
      additionalProperties: false
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/ProductResponse"
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
      required:
      - content
      - totalElements
      - page
      - size
    OrderItemInput:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 999
      required:
      - product_id
      - quantity
    OrderCreate:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            "$ref": "#/components/schemas/OrderItemInput"
        promo_code:
          type: string
          pattern: "^[A-Z0-9_]{4,20}$"
      required:
      - items
    OrderUpdate:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            "$ref": "#/components/schemas/OrderItemInput"
      required:
      - items
    OrderItemResponse:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
        price_at_order:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
      required:
      - product_id
      - quantity
      - price_at_order
    OrderResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          "$ref": "#/components/schemas/OrderStatus"
        promo_code_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderItemResponse"
        total_amount:
          type: number
          format: decimal
