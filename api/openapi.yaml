      - discount_amount
      - created_at
      - updated_at
    OrderTransition:
      type: object
      additionalProperties: false
      properties:
        status:
          "$ref": "#/components/schemas/OrderStatus"
      required:
      - status
    PromoCreate:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]{4,20}$"
        discount_type:
          type: string
          enum:
          - PERCENTAGE
          - FIXED_AMOUNT
        discount_value:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        min_order_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          x-go-type: decimal.Decimal
          x-go-type-import:
            path: github.com/shopspring/decimal
        max_uses:
          type: integer
          minimum: 1
          maximum: 2147483647
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
          default: true
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
    PromoResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        current_uses:
          type: integer
      required:
      - id
      - code
      - current_uses
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 72
        role:
          type: string
          enum:
          - USER
          - SELLER
          default: USER
      required:
      - email
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
      required:
      - email
      - password
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - refresh_token
    TokenPair:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
        user_id:
          type: string
          format: uuid
        role:
          "$ref": "#/components/schemas/Role"
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user_id
      - role
    Error:
      type: object
      additionalProperties: false
      properties:
        error_code:
          type: string
          enum:
          - PRODUCT_NOT_FOUND
          - PRODUCT_INACTIVE
          - ORDER_NOT_FOUND
          - ORDER_LIMIT_EXCEEDED
          - ORDER_HAS_ACTIVE
          - INVALID_STATE_TRANSITION
          - INSUFFICIENT_STOCK
          - PROMO_CODE_INVALID
          - PROMO_CODE_MIN_AMOUNT
          - ORDER_OWNERSHIP_VIOLATION
          - VALIDATION_ERROR
          - TOKEN_EXPIRED
          - TOKEN_INVALID
          - REFRESH_TOKEN_INVALID
          - ACCESS_DENIED
          - AUTH_INVALID_CREDENTIALS
          - USER_ALREADY_EXISTS
          - INTERNAL_ERROR
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - DEPENDENCY_UNAVAILABLE
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - error_code
      - message
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
      - status
  responses:
    Error400:
      description: VALIDATION_ERROR — некорректные поля; details.violations содержит
        field и message.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error401:
      description: TOKEN_INVALID / TOKEN_EXPIRED / REFRESH_TOKEN_INVALID / AUTH_INVALID_CREDENTIALS.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error403:
      description: ACCESS_DENIED / ORDER_OWNERSHIP_VIOLATION.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error404:
      description: PRODUCT_NOT_FOUND / ORDER_NOT_FOUND / NOT_FOUND.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error405:
      description: METHOD_NOT_ALLOWED.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error409:
      description: PRODUCT_INACTIVE / ORDER_HAS_ACTIVE / INVALID_STATE_TRANSITION
        / USER_ALREADY_EXISTS. / INSUFFICIENT_STOCK — недостаточно остатков; details.products
        содержит product_id, requested_quantity, available_stock.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error422:
      description: PROMO_CODE_INVALID / PROMO_CODE_MIN_AMOUNT.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error429:
      description: ORDER_LIMIT_EXCEEDED.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error500:
      description: INTERNAL_ERROR.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error503:
      description: DEPENDENCY_UNAVAILABLE — временно недоступен другой сервис.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
